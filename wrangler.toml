name = "fileguard"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# Статические страницы раздаются тем же Worker'ом,
# а запросы /api/* сначала попадают в код Worker'а.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# Email первоначального администратора (можно несколько через запятую).
# Эти адреса получают права администратора и одобряются автоматически.
ADMIN_EMAILS = "admin@example.com"

# Секреты задаются командами (не хранятся в файле):
#   npx wrangler secret put SHEETDB_URL     -> https://sheetdb.io/api/v1/5v95w5jew3777
#   npx wrangler secret put JWT_SECRET      -> длинная случайная строка
#   npx wrangler secret put SHEETDB_TOKEN   -> (необязательно) Bearer-токен SheetDB
